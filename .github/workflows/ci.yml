name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: node test.js
        env:
          PORT: '8123'
          JWT_SECRET: 'ci-test-secret-do-not-use-in-production'
          OWNER_EMAIL: 'owner@orpa.local'
          OWNER_PASSWORD: 'ciownerpass123'

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: orpa-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run -d --name orpa-ci \
            -p 8124:8000 \
            -e JWT_SECRET=ci-docker-test-secret \
            -e OWNER_EMAIL=owner@orpa.local \
            -e OWNER_PASSWORD=dockerpass123 \
            orpa-server:ci
          sleep 5
          curl -sf http://localhost:8124/health | jq .
          curl -sf http://localhost:8124/index.html | head -1
          docker rm -f orpa-ci

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package.json
        run: node -e "const pkg = require('./package.json'); console.log('Package:', pkg.name, pkg.version);"
